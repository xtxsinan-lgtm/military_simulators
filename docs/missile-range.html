<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导弹射程估算</title>
<link rel="stylesheet" href="css/missile_range.css?v=4">
</head>
<body>
<div class="scanline"></div>
<header>
  <div>
    <div class="title">导弹射程估算终端</div>
    <div class="subtitle">RANGE · HGV / RAM / CRUISE / BALLISTIC</div>
  </div>
  <nav class="nav-links" aria-label="模拟器导航">
    <a class="nav-link" href="index.html">启动页</a>
    <a class="nav-link" href="takeoff.html">起飞仿真</a>
    <a class="nav-link" href="missile-interception-strike.html">饱和打击</a>
    <a class="nav-link" href="combat-radius.html">作战半径</a>
    <a class="nav-link current" href="missile-range.html">导弹射程</a>
    <div class="clock" id="clock">SYS READY</div>
  </nav>
</header>

<div class="grid">
  <div class="stack">
    <div class="panel">
      <div class="panel-head"><span>弹体与发射条件</span><span class="tag">INPUT</span></div>
      <p class="note" id="classBlurb">选择弹种和预设。固体比冲默认 264 s，用于助推滑翔、弹道、冲压助推和末端火箭。吸气巡航另有更高的比冲，随弹种变化；带助推器时两段分开算。点表中一行可切换预设。</p>
      <div class="field">
        <label>弹种</label>
        <select id="missileClass"></select>
      </div>
      <div class="field">
        <label>预设样本</label>
        <select id="preset"></select>
      </div>
      <div class="pair">
        <div class="field"><label>弹长 <span class="unit">m</span></label><input type="number" id="lengthM" step="0.01" min="0.1"></div>
        <div class="field"><label>弹径 <span class="unit">m</span></label><input type="number" id="diameterM" step="0.001" min="0.05"></div>
      </div>
      <div class="field"><label>战斗部 <span class="unit">kg</span></label><input type="number" id="warheadKg" step="1" min="0"></div>
      <div class="section-label cyan">▸ 发射条件</div>
      <div class="pair">
        <div class="field"><label>发射马赫数</label><input type="number" id="vMach" step="0.05" min="0"></div>
        <div class="field"><label>发射高度 <span class="unit">km</span></label><input type="number" id="hKm" step="0.1" min="0"></div>
      </div>
      <div class="section-label amber">▸ 推进剂</div>
      <div class="pair">
        <div class="field"><label>固体比冲 <span class="unit">s</span></label><input type="number" id="ispS" step="1" min="1" value="264"></div>
        <div class="field" id="ispAirField" hidden><label>吸气比冲 <span class="unit">s</span></label><input type="number" id="ispAir" step="1" min="1" value="1500"></div>
      </div>
      <div class="field" id="ballisticSingleStageField" hidden>
        <label><input type="checkbox" id="ballisticSingleStage"> 仅单级（不搜索两级、三级）</label>
      </div>
      <div class="field" id="optimizeGeometryField">
        <label><input type="checkbox" id="optimizeGeometry" checked> 寻优滑翔体尺寸（容积、升阻比与助推装药最大化射程）</label>
      </div>
      <div class="field"><label>密度 <span class="unit">kg/m³</span></label><input type="number" id="density" step="10" min="1" value="1760"></div>
      <button class="run" id="runBtn" type="button">▶ 估算射程</button>
    </div>
  </div>

  <div class="stack">
    <div class="panel">
      <div class="panel-head"><span>估算结果</span><span class="tag">OUTPUT</span></div>
      <div id="status" class="clock">STANDBY</div>
      <div id="resultBox" class="placeholder">选择预设后显示样本射程，或点「估算射程」按当前参数重算。</div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <span>预设样本表</span>
        <label class="fail-filter"><input type="checkbox" id="failOnly"> 只看未达工作速度</label>
        <span class="tag">TABLE</span>
      </div>
      <p class="note" id="takeoverSummary"></p>
      <div class="scroll-x" id="tableBox"></div>
    </div>
  </div>
</div>
<div class="footer">Python 仿真核心 · 预设表来自 catalog · 改参数后由 Pyodide 重算</div>
<script type="module" src="js/missile_range.js?v=63"></script>
</body>
</html>
